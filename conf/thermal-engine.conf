# 参考副本：本机 /vendor/etc/thermal-engine.conf 的原始内容（段名与传感器名留档）。
# 温控屏蔽的实际做法不是挂这一份，而是挂 conf/empty.conf（空文件），见 lib/thermal.sh。
# 保留它只为了解本机有哪些策略段，改节点时对照用，运行时不读取。
[BATTERY_CHARGING_CTL]
algo_type monitor
sampling 1000
sensor batt_temp xo_therm gpuss-0
thresholds 999000 999000 999000
thresholds_clr 999000 999000 999000
actions battery
action_info 0

[SKIN_CPU_MONITOR]
algo_type monitor
sampling 1000
sensor skin-therm
thresholds 999000
thresholds_clr 999000
actions cpu
action_info 0

[SKIN_GPU_MONITOR]
algo_type monitor
sampling 1000
sensor skin-therm-0 skin-therm-1
thresholds 999000 999000
thresholds_clr 999000 999000
actions gpu
action_info 0

[virtual-sensor-0]
algo_type monitor
sampling 1000
sensor vbat
thresholds 999000
thresholds_clr 999000
actions battery
action_info 0

[virtual-sensor-4]
algo_type monitor
sampling 1000
sensor vbatt
thresholds 999000
thresholds_clr 999000
actions battery
action_info 0

[CCC-MONITOR]
algo_type monitor
sampling 1000
sensor ccc-temp
thresholds 999000
thresholds_clr 999000
actions cpu
action_info 0

[Charge_Broadcast_MONITOR]
algo_type monitor
sampling 1000
sensor charge_broadcast
thresholds 999000
thresholds_clr 999000
actions battery
action_info 0
